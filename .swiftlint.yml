# ktlint·detekt 자리를 대신한다. CI에서 --strict로 돌아 경고도 실패가 된다.

included:
  - MedicalMate
  - MedicalMateTests

disabled_rules:
  # 한국어 주석이 길어 줄 길이를 따로 잡는다. 아래 line_length가 대신한다.
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 700

identifier_name:
  min_length: 1
  excluded: [id, x, y, s2, s4, s6, s8]
  # 테스트 이름을 우리말로 적는다. 한글에는 대소문자가 없어 "소문자로 시작하라"를
  # 지킬 방법이 없다. 사람이 정했다(2026-11-21).
  validates_start_with_lowercase: off

# 디자인 토큰은 Figma 값을 그대로 적는 자리라 숫자가 많다.
number_separator:
  minimum_length: 7

force_unwrapping:
  severity: warning
