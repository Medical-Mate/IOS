name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint --strict

  test:
    name: Build and test
    # iPhone 17 대상이 iOS 26 SDK를 요구한다. macos-15 이미지에는 Xcode 26이 없어
    # 이 작업이 M0 이후 한 번도 돌지 못했다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        # 이미지 기본 Xcode를 쓴다. 경로를 박아 두면 이미지가 올라갈 때 또 멈춘다.
        run: xcodebuild -version
      - name: Test
        run: |
          xcodebuild test \
            -project MedicalMate.xcodeproj \
            -scheme MedicalMate \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
