name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint --strict

  test:
    name: Build and test
    # iPhone 17 대상이 iOS 26 SDK를 요구한다. macos-15 이미지에는 Xcode 26이 없어
    # 이 작업이 M0 이후 한 번도 돌지 못했다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        # 이미지 기본 Xcode를 쓴다. 경로를 박아 두면 이미지가 올라갈 때 또 멈춘다.
        run: xcodebuild -version
      # **러너가 시뮬레이터를 등록하기 전에 테스트가 먼저 뛸 때가 있다.** 한 번
      # "Unable to find a device matching the provided destination specifier"로
      # 빨간 불이 났는데 같은 코드가 다음 실행에서 통과했다. 기다리기만 하고
      # 검사를 무르지 않는다 — 90초 안에 안 뜨면 그대로 실패한다.
      - name: Wait for simulator
        run: |
          for i in $(seq 1 30); do
            if xcrun simctl list devices available | grep -q "iPhone 17"; then
              echo "iPhone 17 준비됨 (${i}번째 확인)"
              exit 0
            fi
            sleep 3
          done
          echo "iPhone 17을 찾지 못했다. 러너에 있는 기기:"
          xcrun simctl list devices available
          exit 1

      - name: Test
        run: |
          xcodebuild test \
            -project MedicalMate.xcodeproj \
            -scheme MedicalMate \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
